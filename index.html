<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital SAT Math Practice</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1b1b1f;--mut:#6b6f7a;--line:#d9dbe1;--pri:#1a4fd6;--sel:#e8efff;--bad:#c62828;--ok:#2e7d32}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,Segoe UI,Arial,sans-serif;color:var(--fg);background:var(--bg)}
button{font:inherit;cursor:pointer}
.btn{background:var(--pri);color:#fff;border:0;border-radius:999px;padding:8px 22px}
.btn.o{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.btn:disabled{opacity:.4;cursor:default}
.wrap{max-width:760px;margin:0 auto;padding:24px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:3px dashed var(--line)}
.timer{text-align:center;font-weight:700;font-size:20px}.timer small{display:block;font-weight:400}
.tool{background:none;border:0;color:var(--fg);padding:4px 10px}
main.q{max-width:820px;margin:0 auto;padding:20px 20px 110px}
.qhead{display:flex;align-items:center;gap:12px;background:#f1f2f5;padding:6px 12px;border-bottom:2px solid var(--fg);margin-bottom:16px}
.num{background:var(--fg);color:#fff;padding:4px 12px;font-weight:700}
.flag{margin-left:auto;background:none;border:0}.flag.on{color:var(--bad);font-weight:700}
.qtext{font-size:18px;margin-bottom:18px}.qtext img{max-width:100%}
.ch{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;cursor:pointer}
.ch.sel{border-color:var(--pri);background:var(--sel)}
.ch.el .t{text-decoration:line-through;color:var(--mut)}
.L{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--fg);display:grid;place-items:center;font-weight:700;flex:none}
.ch.sel .L{background:var(--pri);color:#fff;border-color:var(--pri)}
.t{flex:1}.x{background:none;border:1px solid var(--line);border-radius:50%;width:24px;height:24px;color:var(--mut)}
input.spr{font-size:20px;padding:10px 14px;border:1.5px solid var(--fg);border-radius:8px;width:220px}
footer.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:3px dashed var(--line);padding:10px 20px;display:flex;align-items:center;justify-content:space-between}
.pill{background:var(--fg);color:#fff;border:0;border-radius:8px;padding:8px 16px}
.pop{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);width:min(560px,94vw);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px #0003;padding:16px;z-index:30}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:10px;margin:12px 0}
.g{height:42px;border:1.5px dashed var(--pri);background:#fff;color:var(--pri);border-radius:6px;position:relative;font-weight:700}
.g.done{border-style:solid;background:var(--pri);color:#fff}.g.cur{outline:3px solid var(--fg)}
.g.f::after{content:"⚑";position:absolute;top:-8px;right:-4px;color:var(--bad);font-size:14px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.ok{color:var(--ok)}.bad{color:var(--bad)}
#desmos{position:fixed;right:20px;top:70px;width:520px;height:460px;min-width:300px;min-height:260px;background:#fff;border:1.5px solid var(--fg);border-radius:10px;box-shadow:0 8px 30px #0004;z-index:40;display:none;flex-direction:column;resize:both;overflow:hidden}
#dh{background:var(--fg);color:#fff;padding:6px 12px;cursor:move;display:flex;justify-content:space-between;user-select:none}
#dh button{background:none;border:0;color:#fff}#dc{flex:1}
.mask{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:50}.mask>div{background:#fff;padding:24px;border-radius:12px;max-width:420px}
@media(max-width:640px){#desmos{left:0!important;right:0!important;top:auto!important;bottom:0!important;width:100%!important;height:62vh;border-radius:14px 14px 0 0;resize:none}footer.nav>span:first-child{display:none}header.top{padding:8px 10px}.timer{font-size:16px}.tool{padding:4px 5px;font-size:14px}}</style></head><body>

 radius of $\\frac34$ feet. What is the volume, in cubic feet, of the sphere?", "type": "mc", "choices": ["$\\frac{9\\pi}{64}$", "$\\frac{27\\pi}{64}$", "$\\frac{9\\pi}{16}$", "$\\frac{4\\pi}{3}$"], "answer": "C"}, {"text": "For the linear function $f$, the graph of $y=f(x)$ in the $xy$-plane has a slope of 46 and passes through the point $(0,0)$. The function $f$ is defined by $f(x)=ax$, where $a$ is a constant. What is the value of $a$?", "type": "spr", "answer": ["46"]}, {"text": "$$6|11-x|+5=77$$ What is the sum of the solutions to the given equation?", "type": "mc", "choices": ["$-1$", "12", "22", "23"], "answer": "C"}, {"text": "$$c=22t$$ The given equation relates the distance $c$, in centimeters, traveled by a conveyor belt to the time $t$, in seconds, since the belt started moving. What is the rate of change of the belt’s distance over time?", "type": "mc", "choices": ["$22t$ centimeters per second", "22 centimeters per second", "$\\frac1{22}$ centimeters per second", "$\\frac1{22t}$ centimeters per second"], "answer": "B"}, {"text": "$$\\frac x4+\\frac y3=\\frac72$$ $$5(x-2y)=2y+14$$ What is the value of $2x+y$?", "type": "spr", "answer": ["23"]}, {"text": "A workshop that makes lamps calculates its monthly profit, in dollars, by subtracting its fixed monthly cost, in dollars, from its monthly sales revenue, in dollars. The expression $14{,}000-3.50x-4{,}200$ represents this situation for a month in which $x$ lamps are manufactured and sold. Which statement is the best interpretation of $3.50x$ in this context?", "type": "mc", "choices": ["The monthly sales revenue, in dollars, from selling $x$ lamps", "The monthly sales revenue, in dollars, from each lamp sold", "The monthly cost, in dollars, of manufacturing each lamp", "The monthly cost, in dollars, of manufacturing $x$ lamps"], "answer": "D"}, {"text": "The graph models the number of open service tickets a help desk had $x$ weeks after the end of March, where $0\\le x\\le 6$. According to the model, wh , $D$, and $M$. Which expression represents the value of $D$ for distinct positive values of $W$ and $M$?", "type": "mc", "choices": ["$\\frac{58M}{W+M}$", "$\\frac{WD}{58-D}$", "$\\frac{58M}{W+1}$", "$\\frac{D(M+W)}{M}$"], "answer": "A"}, {"text": "A quality analyst selected 2 random samples of batteries of a certain type to estimate the average time this type of battery lasts under continuous use. Based on the first sample, the analyst estimated an average of 8.6 hours, with an associated margin of error of 0.4 hours. Based on the second sample, the analyst estimated an average of 8.9 hours, with an associated margin of error of 1.5 hours. Assuming the margins of error were calculated the same way, which of the following best explains why the first sample obtained a smaller margin of error than the second sample?", "type": "mc", "choices": ["The first sample contained more batteries than the second sample.", "The first sample contained fewer batteries than the second sample.", "The batteries in the first sample lasted less time on average than those in the second sample.", "The batteries in the first sample lasted more time on average than those in the second sample."], "answer": "A"}, {"text": "In the figure shown, the measure of angle $P$ is $47^\\circ$. The length of $\\overline{PQ}$ is 30 units and the length of $\\overline{PR}$ is 19 units. What is the area, in square units, of triangle $PQR$?", "type": "mc", "choices": ["285", "570", "$285\\sin 47^\\circ$", "$570\\sin 47^\\circ$"], "answer": "C", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAm0AAAE2CAIAAAC8yDJAAAAUZElEQVR42u3dfWydZd0H8Gv1iDKEwCidMDNJwAWhgTE0EzOfSiSTBaPdsMlEFBLTVmbMfP4ZnW4YIzHrgsMSo1g1YZoFk9bpErERZmTaLKvCIGBrN0jWVA1unr0oK8p21j5/HHKeQ9d2Xc/b/fL5/NVz79CWu92+57p/53tf8yYmJgIAMCd1TgEAyFEAkKMAIEcBQI4CAHIUAOQoAMhRAJCjAIAcBQA5CgByFADkKADIUQBAjgKAHAUAOQoAchQAkKMAUBYZp4Bq+tGPfpTL5ab4Rcxk6uvrP/ShD7373e92loAYmTcxMeEsUB0nTpy44447crncc889F0K46aab3vnOd4YQTp06dejQoRMnTmQymfXr1z/88MPOFSBHYWrPPvvsBz/4 ircle $N$ has an area of $144\\pi$ mm$^2$. The radius of circle $P$ is equal to the difference of the radius of circle $N$ and the radius of circle $M$. What is the total area, in mm$^2$, of circles $M$, $N$, and $P$?", "type": "mc", "choices": ["$193\\pi$", "$218\\pi$", "$288\\pi$", "$344\\pi$"], "answer": "B"}, {"text": "$$-\\frac1{12}rx+\\frac56=9-\\frac34x$$ In the given equation, $r$ is a constant. The equation has no solution. What is the value of $r$?", "type": "spr", "answer": ["9"]}, {"text": "$$-6x(x+8)=18$$ One solution to the given equation can be written as $z-\\frac a2\\sqrt b$, where $z$, $a$, and $b$ are integers and $a$ and $b$ are positive. What is the value of $\\frac ab$?", "type": "mc", "choices": ["$\\frac1{26}$", "$\\frac2{13}$", "$\\frac4{13}$", "$\\frac{13}2$"], "answer": "B"}, {"text": "$$17(x-c)=17y+17c$$ One of the equations in a system of two linear equations is given, where $c$ is a positive constant. The system has no solution. Which equation could be the second equation in this system?", "type": "mc", "choices": ["$3x-3y=6c$", "$3x+3y=6c$", "$3x-3y=3c$", "$3x+3y=3c$"], "answer": "C"}, {"text": "$$(x-m)^2=(m-6a)(x-m)$$ In the given equation, $a$ and $m$ are constants, where $m>6a$. The sum of the solutions to the equation is $3m+48$. What is the value of $a$?", "type": "spr", "answer": ["-8"]}, {"text": "The function $p$ is defined by $p(x)=a\\big((x+7)^2-b\\big)\\big((x+7)^2+c\\big)$, where $a$, $b$, and $c$ are constants. In the $xy$-plane, the graph of $y=p(x)$ passes through the points $(-9,44)$ and $(0,517)$. What is the value of $p(-5)+p(-14)$?", "type": "spr", "answer": ["561"]}, {"text": "A quadratic function models the height, in feet, of a projectile above the ground in terms of the time, in seconds, after the projectile was launched. According to the model, the projectile was launched from a height of 0 feet and reached its maximum height of 2,025 feet, 9 seconds after it was launched. Based on the model, what was the height, in feet, of the projectile 5 seconds after it was launched?", "type": "spr", "answer": ["1625"]}, {"text": "The equation $N(m)=80(Q)^{m/4}$ gives the predicted population $N(m)$, in thousands, of a bacteria colony $m$ minutes after the initial measurement, where $Q$ is a constant greater than 1. The predicted population increases by $p\\%$ every 240 seconds. What is the value of $p$ in terms of $Q$?", "type": "mc", "choices": ["$100(Q-1)$", "$100(Q+1)$", "$100(Q^4-1)$", "$100(Q^{1/4}-1)$"], "answer": "A"}]]}, {"id": 11, "title": "SAT Practice Test 11", "time": 2100, "modules": [[{"text": "The function $v$ models the volume, in liters, of water remaining in a tank $x$ minutes after the tank began draining. The graph of $y=v(x)$ is shown. According to the model, what was the volume, in liters, of water remaining in the tank 6 minutes after the tank began draining?", "type": "mc", "choices": ["5", "15", "30", "45"], "answer": "B", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAiMAAAGBCAIAAAA7dCaeAABGi0lEQVR42u3deVzU1f4/8DPDrAzLMAwMmywii2yCqGiQiopUaJEmWrbhkl8ls19mlMute7tey26U18xMEyu3JLPQVLwmlYQgIosii6yyb4IwMBvM/P74GI7DctGAGWZez4d/yJkPM3MOn5nXnM/nzPtDU6lUBAAAYNjQMQQAAICkAQAAJA0AAACSBgAAtIKhNz2pr69///33e7eHhoYuXLhQozExMXH//v3l5eVWVlYLFix45ZVXjIyMsDcAACBpBtLS0rJr164+eshgaCRNbGzsxx9/vG3btn/961+5ubkxMTE//fTTqVOnGAwGdggAACTNQJycnIqLizUa6fT7jhCeOXNm+/btGzdu3LBhAyHEy8uLzWYvWLBg27ZtW7ZswQ4BADDkaHrzfZqCgoLHHnusvLx84M1CQkL++OOPyspKBwcHqkWlUjk4OHR2dtbX17NYLOwTAABDy7BWBDQ2Nqampjo7O/fEDCGERqOFhIS0trYmJydjhwAAGHL6dmaitrY2KSmptrbW1NQ0KCho8uTJ6rfm5OSoVCpXV1eN36JasrOzw8PDsU8AAGBO06+ampqAgIBLly4pFIpLly4FBwc/+uijVVVVPRtUVlYSQoRCocYvWllZEULUtwQAAMxpNBkbG4eHh3/55Ze2trZUy7Jly+bMmfPYY49dvXqVOgHT0dFBCGGz2Rq/S7WIxeLBPFDvKREAgOEoKSkx3DmNo6PjyZMne2KGEDJ79uyIiIi8vLyjR49SLUwmkxDS1dWl8btUC5YDAAAMBz1fETB16lRCyMWLF6kfLS0t+5y7UC0CgQA7BADAkNPz7ypSp2Tu3LlD/ejp6Un6Oh9Dnb+hbh3WKeSQOJBSSgh5OWSstkZVu08A3Uf30X2tPPpfOXGgP3Oazz77LDs7W6ORCpWeQ2peXl4ikejGjRsKhUJ9s6ysLEJIaGgoPnoAAAw5/UmaAwcOHDx4UKPx7NmzhJ )(3)$", "$\\left(\\frac{7\\pi}{15}\\right)(180)(3)$"], "answer": "B"}, {"text": "In $\\triangle JKL$, $JK=KL$ and the measure of angle $K$ is $38^\\circ$. What is the measure of angle $J$?", "type": "mc", "choices": ["$19^\\circ$", "$38^\\circ$", "$71^\\circ$", "$142^\\circ$"], "answer": "C"}, {"text": "What is the $x$-intercept of the graph of $y=\\frac{28-x}{cx+d}$ in the $xy$-plane, where $c$ and $d$ are positive constants?", "type": "mc", "choices": ["$\\left(-\\frac dc,0\\right)$", "$\\left(0,\\frac{28}{d}\\right)$", "$(0,-28)$", "$(28,0)$"], "answer": "D"}, {"text": "$$2x+5y=43$$ $$6x-ky=-25$$ In the given system of equations, $k$ is a constant. The solution to the system is $(x,y)$, where $x=4$. What is the value of $k$?", "type": "spr", "answer": ["7"]}, {"text": "$$D=\\frac{0.75(h-8)}{2w}$$ The given equation relates the density $D$ of a beam to its height $h$, in centimeters, and its width $w$, in centimeters. Which equation correctly expresses the height of the beam in terms of its density and its width?", "type": "mc", "choices": ["$h=\\frac{2wD}{0.75}-8$", "$h=\\frac{2wD}{0.75}+8$", "$h=\\frac{0.75wD}{2}+8$", "$h=\\frac{2wD+8}{0.75}$"], "answer": "B"}, {"text": "For the polynomial function $g$, the graph of $y=g(x)$ in the $xy$-plane passes through the points $(-8,0)$, $(2,0)$, and $(11,0)$. Which of the following must be a factor of $g(x)$?", "type": "mc", "choices": ["$x+2$", "$x-8$", "$x-11$", "$x+11$"], "answer": "C"}, {"text": "$$f(x)=3^{-4(x+2)}$$ Which of the following equivalent forms of the given function $f$ displays, as the base or the coefficient, the $y$-coordinate of the $y$-intercept of the graph of $y=f(x)$ in the $xy$-plane?", "type": "mc", "choices": ["$f(x)=\\frac1{6{,}561}\\left(\\frac13\\right)^{4x}$", "$f(x)=\\left(\\frac13\\right)^{4x+8}$", "$f(x)=3^{-4x-8}$", "$f(x)=6{,}561^{-x-2}$"], "answer": "A"}, {"text": "In the $xy$-plane, line $k$ is perpendicular to the line defined by $4x+7y=21$, has an $x$-intercept of $(-8,0)$, and has a $y$-intercept of $(0,p)$. What is the value of $p$?", "type": "spr", "answer": ["14"]}, {"text": "The vertex of a parabola is at $(34,-19)$. If one of the $x$-intercepts is at $x=51$, what is the $x$-coordinate of the second $x$-intercept of the parabola?", "type": "mc", "choices": ["$-17$", "17", "23", "68"], "answer": "B"}, {"text": "The area of a solar panel array is increasing at a rate of 0.45 square meters per second. Which of the following is closest to this rate expressed in square feet per hour? (1 meter = 3.28 feet)", "type": "mc", "choices": ["1,476", "5,313", "17,429", "57,166"], "answer": "C"}, {"text": "The length of a copper wire, in millimeters, is given by $L(T)=0.0045(T-15)+320$, where $T$ is the temperature in degrees Celsius. If the temperature increases by 400 degrees Celsius, by how much does the length of the wire increase, in millimeters?", "type": "mc", "choices": ["1.8", "4.5", "18", "321.8"], "answer": "A"}, {"text": "A quality engineer selected 2 random samples of a certain model of battery to estimate the average number of hours the battery lasts under continuous use. Based on the first sample, the engineer estimated an average of 18.6 hours, with an associated margin of error of 0.8 hour. Based on the second sample, the engineer estimated an average of 18.9 hours, with an associated margin of error of 1.9 hours. Assuming the margins of error were calculated the same way, which best explains why the first sample obtained a smaller margin of error than the second sample?", "type": "mc", "choices": ["The first sample contained fewer batteries than the second sample.", "The first sample contained more batteries than the second sample.", "The batteries in the first sample lasted fewer hours on average than those in the second sample.", "The batteries in the first sample lasted more hours on average than those in the second sample."], "answer": "B"}, {"text": "Which expression is equivalent to $3x^3+15x^2y+2xy^2+10y^3$?", "type": "mc", "choices": ["$(3x^2+10y)(x+y^2)$", "$(3x^2+2y^2)(x+5y)$", "$(3x^3+2y^2)(x^2+5y^3)$", "$(3x^3+2y^3)(x+5y)$"], "answer": "B"}, {"text": "The function $f$ is defined by $f(x)=ab^{x/n}$, where $a$, $b$, and $n$ are constants, and $b$ and $n$ are integers. If $f(4)=5$ and $f(10)=320$, what is the value of $f(13)$?", "type": "mc", "choices": ["640", "1,280", "2,560", "20,480"], "answer": "C"}, {"text": "Data set $M$ consists of 60 integers, where the value of each integer is between 120 and 180. Data set $N$ consists of the same 60 integers in $M$ as well as the integer 940. Which of the following must be greater for data set $N$ than for data set $M$?<br>I. The mean<br>II. The median", "type": "mc", "choices": ["I only", "II only", "I and II", "Neither I nor II"], "answer": "A"}, {"text": "The function $f$ is defined by $f(x)=a^x-b$, where $a$ and $b$ are constants. In the $xy$-plane, the graph of $y=f(x)$ passes through the points $(c,5)$ and $(2c,137)$, where $c$ is a constant. Which of the following could be the value of $b$?", "type": "mc", "choices": ["7", "12", "132", "144"], "answer": "A"}, {"text": "The scatterplot shows data set $A$, which consists of the masses $y$, in grams, of a rabbit kit at various ages $x$, in weeks. The equation of a line of best fit for the relationship in data set $A$ can be written as $y=3.2+10.7x$, where $1\\le x\\le 5$.<br>The rabbit kit was weighed again at 8 weeks old and had a mass of 120 grams. Data set $B$ consists of all the data points in data set $A$ as well as the data point $(8,120)$. The equation of a line of best fit for data set $B$ can be written as $y=r+sx$, where $r$ and $s$ are constants and $1\\le x\\le 8$. Assuming the equations of the lines of best fit are calculated in the same way, which of the following is the best estimate for the value of $s$?", "type": "mc", "choices": ["6.4", "10.7", "14.9", "21.3"], "answer": "C", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAg0AAAG3CAIAAAC4w/FNAABF2klEQVR42u3de0CM2e const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function tex(el){if(window.renderMathInElement)renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],throwOnError:false});else setTimeout(()=>tex(el),300)}
function fmt(t){const m=Math.floor(t/60),s=t%60;return m+":"+String(s).padStart(2,"0")}

function home(){clearInterval(timer);S=null;
 $("#app").innerHTML=`<div class="wrap"><h1>Digital SAT Math Practice</h1>${saved()?`<div class="card" style="background:var(--sel)"><div><b>Unfinished test</b><br><small>${esc(saved().t.title)}</small></div><span><button class="btn" onclick="resume()">Resume</button> <button class="btn o" onclick="localStorage.removeItem('satS');home()">Discard</button></span></div>`:""}<p style="color:var(--mut)">Choose a test. Each has two timed modules with the Desmos calculator available.</p>

 </div>`}
function loadJSON(f){if(!f)return;f.text().then(t=>{try{TESTS=JSON.parse(t);home()}catch(e){alert("Invalid JSON: "+e.message)}})}

function start(i){const t=TESTS[i];S={t,m:0,i:0,ans:t.modules.map(m=>m.map(()=>({}))),flag:t.modules.map(m=>m.map(()=>false)),left:t.time||2100,hide:false};popOpen=false;runTimer();render()}
function runTimer(){clearInterval(timer);timer=setInterval(()=>{S.left--;save();const e=$("#tm");if(e)e.textContent=S.hide?"":fmt(S.left);if(S.left<=0)finishModule()},1000)}
function Q(){return S.t.modules[S.m][S.i]}
function A(){return S.ans[S.m][S.i]}

function render(){save();const q=Q(),a=A(),n=S.t.modules[S.m].length;

 <div class="qtext">${q.img?`<img src="${q.img}"><br>`:""}${q.text||""}</div>

 q.choices.map((c,k)=>{const L="ABCD"[k];return `<div class="ch ${a.v===L?"sel":""} ${(a.el||[]).includes(L)?"el":""}" onclick="pick('${L}')"><span class="L">${L}</span><span class="t">${c}</span><button class="x" title="Eliminate" onclick="event.stopPropagation();elim('${L}')">✕</button></div>`}).join("")}

 <span><button class="btn" ${S.i===0?"disabled":""} onclick="go(S.i-1)">Back</button> <button class="btn" onclick="${S.i<n-1?"go(S.i+1)":"review()"}">${S.i<n-1?"Next":"Review"}</button></span></footer>
 ${popOpen?navPop(n,true):""}`;tex($("#app"))}
function navPop(n,cur){return `<div class="pop"><b>Math · Module ${S.m+1} Questions</b><div class="grid">${S.ans[S.m].map((a,k)=>`<button class="g ${a.v?"done":""} ${cur&&k===S.i?"cur":""} ${S.flag[S.m][k]?"f":""}" onclick="go(${k})">${k+1}</button>`).join("")}</div><div style="text-align:center"><button class="btn o" onclick="review()">Go to Review Page</button></div></div>`}
function pick(L){A().v=L;render()}
function elim(L){const a=A();a.el=a.el||[];const i=a.el.indexOf(L);i<0?a.el.push(L):a.el.splice(i,1);render()}
function go(k){S.i=k;popOpen=false;render()}
function review(){popOpen=false;const n=S.t.modules[S.m].length;
 $("#app").innerHTML=`<div class="wrap" style="text-align:center"><h2>Check Your Work</h2><p>Unanswered questions are dashed. ⚑ = marked for review.</p><div class="grid" style="max-width:560px;margin:auto">${S.ans[S.m].map((a,k)=>`<button class="g ${a.v?"done":""} ${S.flag[S.m][k]?"f":""}" onclick="go(${k})">${k+1}</button>`).join("")}</div>
 <p><button class="btn o" onclick="go(0)">Back to questions</button> <button class="btn" onclick="confirmEnd()">${S.m===0?"Submit Module 1":"Submit Test"}</button></p></div>`}
function confirmEnd(){const un=S.ans[S.m].filter(a=>!a.v).length;
 const d=document.createElement("div");d.className="mask";d.innerHTML=`<div><h3>Submit this module?</h3><p>${un?un+" question(s) unanswered. ":""}You cannot return after submitting.</p><button class="btn o" onclick="this.closest('.mask').remove()">Cancel</button> <button class="btn" onclick="this.closest('.mask').remove();finishModule()">Submit</button></div>`;document.body.appendChild(d)}
function finishModule(){if(S.m===0){S.m=1;S.i=0;S.left=S.t.time||2100;popOpen=false;render()}else{clearInterval(timer);results()}}

function num(s){s=String(s).replace(/\s/g,"");if(/^-?\d*\.?\d+\/-?\d*\.?\d+$/.test(s)){const[a,b]=s.split("/");return a/b}const v=Number(s);return s===""?NaN:v}
function ok(q,a){if(!a.v)return false;if(q.type!=="spr")return a.v===q.answer;const u=num(a.v.replace(/,/g,''));return [].concat(q.answer).some(c=>String(c).replace(/\s/g,"")===a.v.replace(/\s/g,"")||(!isNaN(u)&&Math.abs(num(c)-u)<1e-9))}
function results(){localStorage.removeItem('satS');let raw=0;const rows=[];
 S.t.modules.forEach((m,mi)=>m.forEach((q,i)=>{const a=S.ans[mi][i],r=ok(q,a);if(r)raw++;rows.push(`<tr onclick="showQ(${mi},${i})" style="cursor:pointer"><td>M${mi+1} Q${i+1} 🔍</td><td>${esc(a.v||"—")}</td><td>${esc([].concat(q.answer).join(" or "))}</td><td class="${r?"ok":"bad"}">${r?"✓":"✗"}</td></tr>`)}));
 const total=S.t.modules.reduce((s,m)=>s+m.length,0),sc=S.t.scale&&S.t.scale[raw];
 $("#app").innerHTML=`<div class="wrap"><h1>Results</h1><h2>${raw} / ${total} correct</h2>${sc?`<div style="border:2px solid var(--pri);border-radius:14px;padding:18px;text-align:center;margin:14px 0"><div style="color:var(--mut)">Your estimated Math score</div><div style="font-size:56px;font-weight:800;color:var(--pri);line-height:1.1">${sc}</div><div>Likely range: <b>${S.t.range[raw]}</b></div><div style="margin-top:6px">Level: <b>${raw>=40?"Exceptional":raw>=33?"Strong":raw>=25?"Proficient":raw>=16?"Developing":"Building"}</b></div></div><p style="color:var(--mut);font-size:14px">The Digital SAT is adaptive, so this is a working estimate. Use it to track progress, not to predict a test-day score.</p>`:""}
 ${S.t.scale?"":'<p style="color:var(--mut)">Add a "scale" array to the test JSON to show the scaled score.</p>'}
 <p style="color:var(--mut)">Tap any row to see the question.</p><table><tr><th>Question</th><th>Your answer</th><th>Correct</th><th></th></tr>${rows.join("")}</table><p><button class="btn" onclick="home()">Back to tests</button></p></div>`}

function save(){if(!S)return;try{localStorage.setItem("satS",JSON.stringify({id:S.t.id,m:S.m,i:S.i,ans:S.ans,flag:S.flag,left:S.left,hide:S.hide,at:Date.now()}))}catch(e){}}
function saved(){try{const d=JSON.parse(localStorage.getItem("satS"));const t=TESTS.find(x=>x.id==d.id);return t?{...d,t}:null}catch(e){return null}}
function resume(){const d=saved();if(!d)return home();S={t:d.t,m:d.m,i:d.i,ans:d.ans,flag:d.flag,hide:d.hide,left:Math.max(1,d.left-Math.floor((Date.now()-d.at)/1000))};popOpen=false;runTimer();render()}
function modal(html){const d=document.createElement("div");d.className="mask";d.innerHTML=`<div style="max-width:720px;width:94vw;max-height:88vh;overflow:auto">${html}<p style="text-align:right"><button class="btn" onclick="this.closest('.mask').remove()">Close</button></p></div>`;document.body.appendChild(d);tex(d)}
function showQ(mi,i){const q=S.t.modules[mi][i],a=S.ans[mi][i];modal(`<b>Module ${mi+1} · Question ${i+1}</b><div class="qtext" style="margin-top:10px">${q.img?`<img src="${q.img}"><br>`:""}${q.text}</div>${q.type==="spr"?`<p>Your answer: <b>${esc(a.v||"—")}</b><br>Correct answer: <b>${esc([].concat(q.answer).join(" or "))}</b></p>`:q.choices.map((c,k)=>{const L="ABCD"[k];return `<div class="ch" style="cursor:default;${L===q.answer?"border-color:var(--ok);background:#e8f5e9":L===a.v?"border-color:var(--bad);background:#fdecea":""}"><span class="L">${L}</span><span class="t">${c}</span><b>${L===q.answer?"✓":L===a.v?"✗ yours":""}</b></div>`}).join("")}`)}
function ref(){const r=[["Circle","$A=\\pi r^2,\\ C=2\\pi r$"],["Rectangle","$A=\\ell w$"],["Triangle","$A=\\frac12bh$"],["Pythagorean theorem","$c^2=a^2+b^2$"],["30°-60°-90° triangle","sides $x,\\ x\\sqrt3,\\ 2x$"],["45°-45°-90° triangle","sides $s,\\ s,\\ s\\sqrt2$"],["Rectangular solid","$V=\\ell wh$"],["Cylinder","$V=\\pi r^2h$"],["Sphere","$V=\\frac43\\pi r^3$"],["Cone","$V=\\frac13\\pi r^2h$"],["Pyramid","$V=\\frac13\\ell wh$"],["Facts","360° in a circle · $2\\pi$ radians in a circle · 180° in a triangle"]];modal(`<b>Reference Sheet</b><table style="margin-top:8px">${r.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join("")}</table>`)}
